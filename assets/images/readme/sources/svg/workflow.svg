<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#060817"/>
        <stop offset="0.55" stop-color="#0b1230"/>
        <stop offset="1" stop-color="#17113a"/>
      </linearGradient>
      <radialGradient id="haloBlue"><stop offset="0" stop-color="#62ddff" stop-opacity=".32"/><stop offset=".45" stop-color="#5b7cff" stop-opacity=".12"/><stop offset="1" stop-color="#5b7cff" stop-opacity="0"/></radialGradient>
      <radialGradient id="haloOrange"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".34"/><stop offset=".6" stop-color="#ff7a1a" stop-opacity=".08"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#dce8ff" stop-opacity=".16"/>
        <stop offset=".45" stop-color="#7390ff" stop-opacity=".08"/>
        <stop offset="1" stop-color="#05071a" stop-opacity=".28"/>
