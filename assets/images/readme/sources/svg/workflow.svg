        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
      </filter>
      <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
